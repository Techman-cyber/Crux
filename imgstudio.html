<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX Image Studio</title><link rel="stylesheet" href="ui.css">
<style>body{overflow:hidden}.top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#07040f;flex-wrap:wrap}.top .brand{margin:0}.top .brand img{width:34px;height:34px;animation:none}.top .brand b{font-size:16px}.top select,.top input[type=range]{width:auto}
.lay{display:grid;grid-template-columns:200px 1fr 310px;height:calc(100vh - 58px)}#tools{padding:10px;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}#tools button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px}#tools button:hover{background:#8b3dff26}#tools button.on{background:var(--vi)}
#panel{padding:14px;overflow:auto;border-left:1px solid var(--line);font-size:13px}#panel h3{margin-bottom:6px}#panel hr{border:0;border-top:1px solid var(--line);margin:14px 0}#panel .row button{padding:5px 10px}#panel .row button.on{background:var(--vi)}.chk{display:flex;gap:8px;align-items:flex-start;color:var(--mu)}.chk input{margin-top:3px}
#wrap{position:relative;overflow:auto;display:grid;place-items:center;padding:16px;background:#0a0615}#drop{border:2px dashed var(--vi);border-radius:18px;padding:60px 40px;text-align:center;color:var(--mu);max-width:520px}
.stage{position:relative;line-height:0;background-color:#fff;background-image:linear-gradient(45deg,#d9d9e6 25%,transparent 25%,transparent 75%,#d9d9e6 75%),linear-gradient(45deg,#d9d9e6 25%,transparent 25%,transparent 75%,#d9d9e6 75%);background-size:20px 20px;background-position:0 0,10px 10px;box-shadow:0 8px 40px #000a}
#cv{max-width:100%;max-height:calc(100vh - 100px);display:block}#ov{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}#sel{position:absolute;border:2px dashed #29f0ff;background:#29f0ff22;pointer-events:none;display:none}
#msg{color:var(--la);font-size:13px}.sw2{display:inline-block;width:46px;height:46px;border-radius:10px;border:1px solid var(--line);cursor:pointer;margin:0 6px 6px 0}.note{background:#ffb02018;border:1px solid #ffb02066;border-radius:10px;padding:8px 10px;color:#ffd48a;font-size:12.5px;margin:10px 0}
@media(max-width:900px){.lay{grid-template-columns:1fr;height:auto}body{overflow:auto}#tools{flex-direction:row;flex-wrap:wrap;border:0}#panel{border:0}}</style></head><body>
<div class="top"><div class="brand"><img src="logo.png" alt=""><b>IMAGE STUDIO</b></div><button id="open">Open image</button><input id="file" type="file" accept="image/*" hidden><button id="undo">↶ Undo</button><button id="redo">↷ Redo</button><button id="reset">Reset</button><span id="msg"></span><span style="flex:1"></span><select id="fmt"><option value="image/png">PNG</option><option value="image/jpeg">JPEG</option><option value="image/webp">WebP</option></select><label style="margin:0">Quality <input id="ql" type="range" min="40" max="100" value="92" style="width:90px"></label><button id="dl" class="pri">Download</button></div>
<div class="lay"><nav id="tools"></nav><div id="wrap"><div id="drop"><h2>Drop an image here</h2><p>or paste with Ctrl+V, or click “Open image”.<br>Everything happens on your device. Nothing is uploaded.</p></div><div class="stage" id="stage" hidden><canvas id="cv"></canvas><canvas id="ov"></canvas><div id="sel"></div></div></div><aside id="panel"></aside></div>
<script src="imgcore.js"></script><script src="imgstudio.js"></script></body></html>
