<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX Focus guard</title><link rel="stylesheet" href="ui.css"><style>textarea{min-height:170px;font-family:ui-monospace,Menlo,monospace}.ch{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.ch button{padding:3px 10px;font-size:12.5px}</style></head><body><div class="wrap" style="max-width:600px">
<div class="brand"><img src="logo.png" alt=""><b>FOCUS GUARD</b></div><div class="card"><h3>Pomodoro</h3><p class="mu">Focus guard turns on for the work block, then off for the break. Add your sites below first.</p><div class="row"><select id="pd" style="width:auto"><option value="25,5">25 min work / 5 break</option><option value="50,10">50 / 10</option><option value="15,3">15 / 3</option><option value="1,1">1 / 1 (test)</option></select><button id="ps" class="pri">Start focus</button><button id="px">Stop</button><b id="pt" style="margin-left:auto;font:800 28px ui-monospace,Menlo,monospace"></b></div><p id="pl" class="mu"></p></div><div class="card"><h3>Sites to block</h3><p class="mu">One per line. Subdomains are blocked too. Visiting them shows a calm “back to work” page instead.</p><div class="ch" id="ch"></div><textarea id="l" placeholder="youtube.com&#10;instagram.com"></textarea>
<div class="row" style="margin-top:12px"><label style="margin:0;color:var(--tx)"><input type="checkbox" id="on"> Focus guard is on</label><span class="grow"></span><button id="s" class="pri">Save</button></div><p id="m" class="ok"></p></div></div><script src="focus.js"></script></body></html>
