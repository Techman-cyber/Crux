<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX Video Studio</title><link rel="stylesheet" href="ui.css">
<style>body{overflow:hidden}.top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#07040f}.top .brand{margin:0}.top .brand img{width:34px;height:34px;animation:none}.top .brand b{font-size:16px}
.lay{display:grid;grid-template-columns:210px 1fr 330px;height:calc(100vh - 58px)}#tools{padding:10px;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}#tools button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px}#tools button:hover{background:#8b3dff26}#tools button.on{background:var(--vi)}
#panel{padding:14px;overflow:auto;border-left:1px solid var(--line);font-size:13px}#panel h3{margin-bottom:6px}.chk{display:flex;gap:8px;color:var(--mu);align-items:center}
#stage{overflow:auto;display:grid;place-items:center;padding:16px;background:#0a0615;align-content:center;gap:12px}#cv,#pv{max-width:100%;max-height:60vh;background:#000;border-radius:8px;box-shadow:0 8px 40px #000a}#pv{display:none}#bar{width:min(520px,90%);height:10px;border-radius:9px;background:#2a1850;overflow:hidden;display:none}#bar i{display:block;height:100%;width:0;background:var(--vi)}#res{text-align:center}.note{background:#ffb02018;border:1px solid #ffb02066;border-radius:10px;padding:8px 10px;color:#ffd48a;font-size:12.5px;margin:10px 0}.rowb button{padding:2px 9px;font-size:12px}
@media(max-width:900px){.lay{grid-template-columns:1fr;height:auto}body{overflow:auto}#tools{flex-direction:row;flex-wrap:wrap;border:0}#panel{border:0}}</style></head><body>
<div class="top"><div class="brand"><img src="logo.png" alt=""><b>VIDEO STUDIO</b></div><span id="msg" style="color:var(--la);font-size:13px"></span></div>
<div class="lay"><nav id="tools"></nav><div id="stage"><canvas id="cv" width="960" height="540"></canvas><video id="pv" controls></video><div id="bar"><i></i></div><div id="res"></div></div><aside id="panel"></aside></div>
<audio id="au" hidden></audio><script src="gifenc.umd.js"></script><script src="videocore.js"></script><script src="video.js"></script></body></html>
