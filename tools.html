<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX Toolbox</title><link rel="stylesheet" href="ui.css">
<style>.lay{display:grid;grid-template-columns:230px 1fr;gap:18px}#nav{display:flex;flex-direction:column;gap:2px;max-height:82vh;overflow:auto;position:sticky;top:12px}#nav h4{margin:12px 0 4px;color:var(--la);font-size:12px;letter-spacing:.06em}#nav button{text-align:left;border:0;background:none;padding:5px 10px;border-radius:8px;color:var(--tx)}#nav button:hover{background:#8b3dff33}#nav button.on{background:var(--vi)}
.io{display:grid;grid-template-columns:1fr 1fr;gap:12px}textarea{min-height:260px;font-family:ui-monospace,Menlo,monospace;font-size:13px}canvas{background:#fff;border-radius:12px;max-width:100%}.res{white-space:pre-wrap;font:15px/1.7 ui-monospace,Menlo,monospace}.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}.big{font:800 46px ui-monospace,Menlo,monospace}.sw{height:70px;border-radius:12px;border:1px solid var(--line);margin:10px 0}table{border-collapse:collapse;width:100%}td{padding:6px 8px;border-bottom:1px dashed var(--line)}.md h1,.md h2,.md h3{margin:.6em 0 .3em}.md code{background:#0b0618;padding:1px 6px;border-radius:5px}.add{color:var(--ok)}.del{color:var(--bad)}
@media(max-width:800px){.lay,.io{grid-template-columns:1fr}#nav{max-height:none;position:static}}</style></head><body><div class="wrap" style="max-width:1100px">
<div class="brand"><img src="logo.png" alt=""><b>TOOLBOX</b><span>88 free tools · work offline except currency, DNS and IP</span></div>
<div class="lay"><div><input id="qs" placeholder="Search tools" style="margin-bottom:8px"><nav id="nav"></nav></div><div><div class="row" id="opts" style="margin-bottom:10px"></div><div id="main"></div></div></div></div><script src="qrcode.js"></script><script src="tools.js"></script><script src="tools2.js"></script><script src="tools3.js"></script></body></html>
