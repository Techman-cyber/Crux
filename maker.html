<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX Image Maker</title><link rel="stylesheet" href="ui.css">
<style>body{overflow:hidden}.top{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:#07040f;flex-wrap:wrap}.top .brand{margin:0}.top .brand img{width:34px;height:34px;animation:none}.top .brand b{font-size:16px}
.lay{display:grid;grid-template-columns:210px 1fr 320px;height:calc(100vh - 58px)}#tools{padding:10px;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px}#tools button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px}#tools button:hover{background:#8b3dff26}#tools button.on{background:var(--vi)}
#panel{padding:14px;overflow:auto;border-left:1px solid var(--line);font-size:13px}#panel h3{margin-bottom:6px}#panel .row button{padding:5px 10px}.chk{display:flex;gap:8px;color:var(--mu);align-items:center}
#wrap{overflow:auto;display:grid;place-items:center;padding:16px;background:#0a0615}#cv{max-width:100%;max-height:calc(100vh - 100px);background-color:#fff;background-image:linear-gradient(45deg,#d9d9e6 25%,transparent 25%,transparent 75%,#d9d9e6 75%),linear-gradient(45deg,#d9d9e6 25%,transparent 25%,transparent 75%,#d9d9e6 75%);background-size:20px 20px;background-position:0 0,10px 10px;box-shadow:0 8px 40px #000a}#asc{display:none;white-space:pre;font:7px/7px ui-monospace,monospace;color:#e9defa;max-width:100%;overflow:auto;max-height:calc(100vh - 100px)}#msg{color:var(--la);font-size:13px}.pv{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:flex-end}.pv canvas{background:#fff;border-radius:4px}
@media(max-width:900px){.lay{grid-template-columns:1fr;height:auto}body{overflow:auto}#tools{flex-direction:row;flex-wrap:wrap;border:0}#panel{border:0}}</style></head><body>
<div class="top"><div class="brand"><img src="logo.png" alt=""><b>IMAGE MAKER</b></div><span id="msg"></span><span style="flex:1"></span><button id="dl" class="pri">Download</button></div>
<div class="lay"><nav id="tools"></nav><div id="wrap"><canvas id="cv" width="800" height="500"></canvas><pre id="asc"></pre></div><aside id="panel"></aside></div>
<script src="imgcore.js"></script><script src="zip.js"></script><script src="maker.js"></script></body></html>
