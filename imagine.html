<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX AI Image Generator</title><link rel="stylesheet" href="ui.css">
<style>.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:16px}.im{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.im .ph{aspect-ratio:var(--ar,1);display:grid;place-items:center;color:var(--mu);background:#0b0618}.im img{width:100%;display:block}.im .b{display:flex;gap:6px;padding:8px;flex-wrap:wrap}.im .b button{padding:3px 10px;font-size:12.5px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chips button{padding:3px 11px;font-size:12.5px;border-radius:99px}.chips button.on{background:var(--vi)}.note{background:#ffb02018;border:1px solid #ffb02066;border-radius:10px;padding:8px 12px;color:#ffd48a;font-size:12.5px;margin-top:12px}</style></head><body><div class="wrap" style="max-width:1000px">
<div class="brand"><img src="logo.png" alt=""><b>AI IMAGE GENERATOR</b><span>Free, no account</span></div>
<div class="card"><label for="p">Describe the picture</label><textarea id="p" rows="3" placeholder="A cozy reading nook with rain on the window, warm lamp light, watercolor style"></textarea>
<div class="chips" id="st"></div><div class="row" style="margin-top:12px"><div><label>Shape</label><select id="sz"><option value="1024,1024">Square 1024</option><option value="1280,720">Wide 16:9</option><option value="720,1280">Tall 9:16</option><option value="1024,768">Landscape 4:3</option><option value="768,1024">Portrait 3:4</option></select></div><div><label>Model</label><select id="md"><option value="flux">Flux (best detail)</option><option value="turbo">Turbo (faster)</option></select></div><div><label>How many</label><select id="n"><option>1</option><option selected>2</option><option>4</option></select></div><div><label>&nbsp;</label><button id="go" class="pri">Generate</button> <button id="en">Add quality words</button></div></div>
<div class="note">Pictures are made by a free online service (Pollinations), so your description is sent to it. Don’t include private details. It can be slow or busy at times (10 to 60 seconds), and results vary. For a different result, press Generate again.</div></div>
<div class="g" id="g"></div></div><script src="imagine.js"></script></body></html>
