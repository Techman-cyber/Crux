<!doctype html><html lang="en"><head><meta charset="utf-8"><title>CRUX Recorder</title><link rel="stylesheet" href="ui.css">
<style>.tm{font:800 54px ui-monospace,Menlo,monospace;text-align:center;letter-spacing:.05em;margin:6px 0}.rec .tm{color:var(--bad)}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--bad);margin-right:8px;animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}video{width:100%;border-radius:12px;background:#000;margin-top:10px}.big{font-size:80px}</style></head><body><div class="wrap" style="max-width:520px;padding:18px">
<div class="brand"><img src="logo.png" alt=""><b>RECORDER</b></div>
<div id="setup" class="card"><label for="q">Quality</label><select id="q"><option value="1280,3500000">720p · small file</option><option value="1920,6000000" selected>1080p · balanced</option><option value="3840,16000000">4K · huge file</option></select>
<label for="fps">Frame rate</label><select id="fps"><option>15</option><option selected>30</option><option>60</option></select>
<div class="row" style="margin-top:12px"><label style="margin:0;color:var(--tx)"><input type="checkbox" id="mic"> Microphone</label><label style="margin:0;color:var(--tx)"><input type="checkbox" id="sys" checked> Tab or system audio</label></div>
<p class="mu" style="font-size:12.5px">You’ll choose a tab, window or whole screen next. System audio is only offered for tabs on most computers. Nothing leaves your device.</p><button id="go" class="pri" style="width:100%;padding:12px">Choose what to record</button><div id="er" class="bad" role="alert" style="margin-top:8px"></div></div>
<div id="live" class="card" hidden><div id="cd" class="tm big" hidden></div><div id="tm" class="tm">00:00</div><div class="row" style="justify-content:center"><button id="pa">Pause</button><button id="st" class="dng">Stop and save</button></div></div>
<div id="done" class="card" hidden><h3>Recording ready</h3><video id="pv" controls></video><div class="row" style="margin-top:12px"><a id="dl" class="btn pri">Download</a><button id="again">Record again</button></div><p class="mu" style="font-size:12.5px">Saved as WebM. It plays in Chrome, VLC and most editors.</p></div>
</div><script src="recorder.js"></script></body></html>
